name = "helmetsan-ingestion-worker"
main = "src/index.js"
compatibility_date = "2025-01-01"
account_id = "a06a4ae5652491dfb8376dc23488f6a0"

# Bind a Queue Consumer
[[queues.consumers]]
queue = "helmetsan-ingest-queue"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

# Bind a Queue Producer (for PHP to send messages)
[[queues.producers]]
queue = "helmetsan-ingest-queue"
binding = "INGEST_QUEUE"

# Bind the R2 bucket
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "helmetsan"

# Environment Variables
[vars]
R2_PUBLIC_URL = "https://assets.helmetsan.com"
WORDPRESS_REST_URL = "https://helmetsan.com/wp-json"
# Add WORDPRESS_WEBHOOK_SECRET via 'npx wrangler secret put WORDPRESS_WEBHOOK_SECRET'
