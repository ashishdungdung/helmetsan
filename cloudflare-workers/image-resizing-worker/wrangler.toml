name = "helmetsan-image-resizer"
main = "src/index.js"
compatibility_date = "2025-01-01"
account_id = "a06a4ae5652491dfb8376dc23488f6a0"

# To enable image resizing in the Cloudflare Dashboard:
# 1. Go to your Zone (domain)
# 2. Go to Speed -> Optimization -> Image Resizing
# 3. Enable Image Resizing (paid add-on, ~$5/mo for 100k images)

# Environment Variables
[vars]
# Optional: if the worker runs on a different domain than the actual R2 bucket's public domain
R2_PUBLIC_DOMAIN = "assets.helmetsan.com"

# Route intercepts (optional if deployed standalone)
# route = { pattern = "*.helmetsan.com/*", zone_id = "f098a57b228462adf58dcde8b65c77f6" }
