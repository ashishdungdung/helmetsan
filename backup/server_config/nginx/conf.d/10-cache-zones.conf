# Map Cloudflare CF-IPCountry to normalized market
map $http_cf_ipcountry $helmetsan_market {
    default "row";
    US      "us";
    CA      "ca";
    GB      "uk";
    DE      "eu";
    FR      "eu";
    IT      "eu";
    ES      "eu";
    NL      "eu";
    BE      "eu";
    AT      "eu";
    PL      "eu";
    SE      "eu";
    IN      "in";
    JP      "jp";
    AU      "au";
    BR      "br";
}

# FastCGI micro-cache zones
fastcgi_cache_path /var/cache/nginx/microcache
    levels=1:2
    keys_zone=wordpress_cache:100m
    max_size=1g
    inactive=60m
    use_temp_path=off;

# Keep cache key partitioned by URI and normalized market for cookieless requests
fastcgi_cache_key "$scheme$host$request_uri|$helmetsan_market";
fastcgi_cache_use_stale updating error timeout invalid_header http_500 http_503;
fastcgi_cache_lock on;
fastcgi_cache_lock_timeout 5s;
fastcgi_cache_background_update on;
fastcgi_cache_revalidate on;

map $http_cookie $skip_cache_cookie {
    default 0;
    ~*wordpress_logged_in 1;
    ~*wordpress_sec 1;
    ~*wordpress_logged_in_ 1;
    ~*comment_author 1;
    ~*wp_postpass 1;
    ~*wp-postpass_ 1;
    ~*woocommerce_items_in_cart 1;
    ~*woocommerce_cart_hash 1;
    ~*wp_woocommerce_session_ 1;
    ~*helmetsan_geo 1;
    ~*helmetsan_currency 1;
}

map $request_method $skip_cache_method {
    default 1;
    GET 0;
    HEAD 0;
}

map $request_uri $skip_cache_uri {
    default 0;
    ~*/wp-admin/ 1;
    ~*/wp-login.php 1;
    ~*/wp-cron.php 1;
    ~*/wp-json/ 1;
    ~*/purge/ 1;
    ~*/cart/?$ 1;
    ~*/checkout/?$ 1;
    ~*/my-account/ 1;
    ~*preview=true 1;
    ~*add-to-cart 1;
    ~*wc-api 1;
    ~*xmlrpc.php 1;
}

map $http_authorization $skip_cache_auth {
    default 1;
    "" 0;
}

map $args $skip_cache_args {
    default 1;
    "" 0;
}

map $http_cache_control $skip_cache_cache_control {
    default 0;
    ~*no-cache|no-store 1;
}

map $http_pragma $skip_cache_pragma {
    default 0;
    ~*no-cache 1;
}

map "$skip_cache_cookie$skip_cache_method$skip_cache_uri$skip_cache_auth$skip_cache_args$skip_cache_cache_control$skip_cache_pragma" $skip_cache_request {
    default 1;
    "0000000" 0;
}
