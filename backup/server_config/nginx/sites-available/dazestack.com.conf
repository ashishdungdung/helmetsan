server {
    server_name dazestack.com;
    root /var/www/dazestack.com/public;
    index index.php index.html;
    
    access_log /var/www/dazestack.com/logs/access.log combined;
    error_log /var/www/dazestack.com/logs/error.log warn;

    # Security headers
    include /etc/nginx/snippets/wordpress-security.conf;

    # Rate limiting
    limit_req zone=wp_general burst=60;

    # Block access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* /(wp-config\.php|readme\.html|license\.txt|wp-config-sample\.php) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Disable XML-RPC (prevent brute force)
    location = /xmlrpc.php {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Rate limit wp-login
    location = /wp-login.php {
        limit_req zone=wp_login burst=10 nodelay;
        fastcgi_pass unix:/run/php/php8.5-dazestack_com.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # WordPress permalinks
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Image optimization (AVIF/WebP when available)
    include /etc/nginx/snippets/wordpress-images.conf;

    # PHP processing
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.5-dazestack_com.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # FastCGI cache
        fastcgi_cache wordpress_cache;
        fastcgi_cache_methods GET HEAD;
        fastcgi_cache_bypass $skip_cache_request;
        fastcgi_no_cache $skip_cache_request $upstream_http_set_cookie;
        fastcgi_cache_valid 200 301 302 60s;
        fastcgi_cache_valid 404 10m;
        add_header X-FastCGI-Cache $upstream_cache_status always;
    }

    # Static files caching
    location ~* \.(gif|ico|css|js|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Block access to uploads PHP files
    location ~* /(uploads|files)/.*\.php$ {
        deny all;
    }


    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    http2 on;
    http3 on;
    ssl_certificate /etc/letsencrypt/live/dazestack.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dazestack.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    add_header Alt-Svc 'h3=":443"; ma=86400' always;
}
server {
    if ($host = dazestack.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name dazestack.com;
    return 404; # managed by Certbot


}
