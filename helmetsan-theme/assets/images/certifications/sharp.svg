<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="SHARP UK Safety Rating">
  <!-- SHARP uses red/white branding -->
  <rect width="80" height="80" rx="10" fill="#CC0000"/>
  <rect x="4" y="4" width="72" height="72" rx="7" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="40" y="30" font-family="Arial Black,Arial,sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">SHARP</text>
  <!-- 5-star row -->
  <text x="40" y="54" font-family="serif" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">★★★★★</text>
  <text x="40" y="67" font-family="Arial,sans-serif" font-size="7" fill="#FFCCCC" text-anchor="middle" letter-spacing="0.5">UK SAFETY RATING</text>
</svg>
