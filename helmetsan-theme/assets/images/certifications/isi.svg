<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="ISI IS 4151 Certification">
  <!-- ISI uses orange and dark green - BIS/India branding -->
  <rect width="80" height="80" rx="10" fill="#FF6600"/>
  <rect x="4" y="4" width="72" height="72" rx="7" fill="none" stroke="#138808" stroke-width="2.5"/>
  <text x="40" y="32" font-family="Arial Black,Arial,sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">ISI</text>
  <text x="40" y="48" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">IS 4151</text>
  <!-- Ashoka Chakra simplified -->
  <circle cx="40" cy="60" r="7" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
  <circle cx="40" cy="60" r="2" fill="#FFFFFF"/>
  <line x1="40" y1="53" x2="40" y2="67" stroke="#FFFFFF" stroke-width="0.8"/>
  <line x1="33" y1="60" x2="47" y2="60" stroke="#FFFFFF" stroke-width="0.8"/>
  <line x1="35.1" y1="55.1" x2="44.9" y2="64.9" stroke="#FFFFFF" stroke-width="0.8"/>
  <line x1="44.9" y1="55.1" x2="35.1" y2="64.9" stroke="#FFFFFF" stroke-width="0.8"/>
</svg>
